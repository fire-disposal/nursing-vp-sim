name: Auto-Diagnose

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Affected service (prod/staging)'
        required: true
        type: string
        default: 'prod'
      symptom:
        description: 'Symptom observed (e.g. 5xx spike, container unhealthy, high latency)'
        required: true
        type: string
      time_range:
        description: 'Time window for logs (e.g. 30m, 2h)'
        required: false
        type: string
        default: '30m'
      state_snippet:
        description: 'Relevant state.json snippet (optional)'
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Fetch API key from server
        id: api_key
        env:
          SSH_HOST: ${{ vars.SSH_HOST || 'yecaoyun' }}
          SSH_USER: ${{ vars.SSH_USER || 'root' }}
        run: |
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          KEY=$(ssh "$SSH_USER@$SSH_HOST" "grep DEEPSEEK_API_KEY /opt/nursing-vp-sim/.env | cut -d= -f2- | tr -d '\"' | tr -d \"'\" || echo ''")
          echo "::add-mask::$KEY"
          echo "DEEPSEEK_API_KEY=$KEY" >> $GITHUB_ENV

      - name: Collect diagnostics
        id: diag
        env:
          SERVICE: ${{ inputs.service }}
          SYMPTOM: ${{ inputs.symptom }}
          TIME_RANGE: ${{ inputs.time_range }}
          STATE_SNIPPET: ${{ inputs.state_snippet }}
          SSH_HOST: ${{ vars.SSH_HOST || 'yecaoyun' }}
          SSH_USER: ${{ vars.SSH_USER || 'root' }}
        run: |
          pip install -q httpx

          CONTAINER="nursing-vp-sim-backend-1"
          if [ "$SERVICE" = "staging" ]; then
            CONTAINER="nursing-backend-staging"
          fi

          echo "::group::Fetching logs ($CONTAINER, --since $TIME_RANGE)"
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          LOGS=$(ssh "$SSH_USER@$SSH_HOST" "docker logs --since $TIME_RANGE $CONTAINER 2>&1" || echo "LOG_FETCH_FAILED")
          LOGS_COUNT=$(echo "$LOGS" | wc -l)
          echo "$LOGS" > /tmp/container.log

          # Also capture recent errors with timestamps
          echo "" >> /tmp/container.log
          echo "=== 错误日志 (docker logs --since $TIME_RANGE 2>&1 | grep -iE 'error|traceback|exception|critical|fail') ===" >> /tmp/container.log
          echo "$LOGS" | grep -iE 'error|traceback|exception|critical|fail' | tail -30 >> /tmp/container.log || true

          # Capture recent startup events
          echo "" >> /tmp/container.log
          echo "=== 启动/重启事件 (docker logs --since $TIME_RANGE 2>&1 | grep -iE 'start|restart|startup|shutdown|init') ===" >> /tmp/container.log
          echo "$LOGS" | grep -iE 'start|restart|startup|shutdown|init' | tail -10 >> /tmp/container.log || true

          echo "::endgroup::"

          echo "::group::Recent commits"
          git log --oneline -20 > /tmp/recent_commits.txt
          cat /tmp/recent_commits.txt
          echo "::endgroup::"

          echo "::group::LLM Diagnosis"
          python3 scripts/diagnose.py \
            --symptom "$SYMPTOM" \
            --service "$SERVICE" \
            --log-file /tmp/container.log \
            --commits-file /tmp/recent_commits.txt \
            --state-snippet "$STATE_SNIPPET" \
            --output /tmp/diagnosis.md 2>&1
          echo "::endgroup::"

          echo "diagnosis_file=/tmp/diagnosis.md" >> $GITHUB_OUTPUT

      - name: Report diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSIS_FILE: ${{ steps.diag.outputs.diagnosis_file }}
        run: |
          TITLE="[Auto-Diagnose] ${{ inputs.service }}: ${{ inputs.symptom }}"
          BODY=$(cat "$DIAGNOSIS_FILE")

          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "auto-diagnose,bug" \
            --repo "$GITHUB_REPOSITORY"
