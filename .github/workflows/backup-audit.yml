name: Backup audit

# 备份审计：每天只读检查三套备份，任一项不通过即令 CI 失败；不发送备份通知。
#
# 为什么放在 CI 而不是服务器上：这台机器真实发生过“定时备份被静默删掉、81 天没人
# 发现”，以及“每日快照连续 4 次失败无人知晓”。审计结果由 Actions 日志与失败状态呈现，
# 不做自动化修复，也不扩展钉钉通知。
#
# 时间 09:30 UTC = 05:30 EDT：晚于 nursing(04:00) 与 twinsia(04:10) 的备份任务，
# 所以当天失败当天可见。
# 注意：GitHub 会在仓库 60 天无活动后自动停用 schedule；届时到 Actions 页手动 re-enable。

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Audit backups
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          if [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "::error::SSH_HOST / SSH_USER 未配置"
            exit 1
          fi
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          bash deploy/backup-audit.sh "$USER@$HOST"
