name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Deploy version (copy from Staging — same version already verified there)'
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Production
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          VER="${{ inputs.version }}"
          DEPLOY_DIR="/opt/nursing-vp-sim"

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp deploy/docker-compose.prod.yml "$USER@$HOST":$DEPLOY_DIR/docker-compose.yml
          scp rollback.sh "$USER@$HOST":$DEPLOY_DIR/rollback.sh

          ssh "$USER@$HOST" << DEPLOY
            set -e
            cd /opt/nursing-vp-sim
            chmod +x rollback.sh
            printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            BAK="/opt/nursing-vp-sim/backups/pre-deploy-\$(date +%Y%m%d-%H%M%S).sql"
            echo ">> Backup DB"
            docker exec nursing-db pg_dump -U nursing -d nursing_vp > "\$BAK" 2>/dev/null || echo "  (skip)"

            OLD_BACKEND=\$(docker inspect --format '{{.Config.Image}}' nursing-vp-sim-backend-1 2>/dev/null || echo "")
            echo ">> Current: \$OLD_BACKEND"

            echo ">> Deploy v$VER"
            STAGING_VER=\$(docker inspect --format '{{.Config.Image}}' nursing-backend-staging 2>/dev/null | rev | cut -d: -f1 | rev || echo "")
            if [ "\$STAGING_VER" != "$VER" ]; then
              echo "✗ Staging mismatch: requested=$VER, staging=\$STAGING_VER"
              echo "  Deploy to Staging first, verify, THEN deploy to Production."
              exit 1
            fi
            echo "✓ Staging confirmed: v$VER"
            IMAGE_VERSION=$VER docker compose -f docker-compose.yml --env-file .env pull
            IMAGE_VERSION=$VER docker compose -f docker-compose.yml --env-file .env up -d --remove-orphans

            echo ">> Health check..."
            OK=false
            for i in \$(seq 1 30); do
              S=\$(docker inspect --format '{{.State.Health.Status}}' nursing-vp-sim-backend-1 2>/dev/null || echo "")
              case "\$S" in
                healthy) echo "  ✓ healthy (\$((i * 2))s)"; OK=true; break ;;
                unhealthy)
                  echo "  ✗ unhealthy! Rolling back..."
                  if [ -n "\$OLD_BACKEND" ]; then
                    OLD_VER=\$(echo "\$OLD_BACKEND" | rev | cut -d: -f1 | rev)
                    IMAGE_VERSION=\$OLD_VER docker compose -f docker-compose.yml --env-file .env up -d
                    echo "  ⚠ rolled back to \$OLD_VER"
                  fi
                  exit 1 ;;
              esac
              sleep 2
            done
            [ "\$OK" = true ] || { echo "  ✗ timeout"; exit 1; }

            docker exec nursing-vp-sim-backend-1 curl -sf http://localhost:8000/api/health
            echo "\$VER|\$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .version-history
            tail -5 .version-history > .version-history.tmp && mv .version-history.tmp .version-history
            echo ">> Production v$VER ✓"
            docker image prune -f
          DEPLOY

      - name: "✅ Production"
        run: echo "v${{ inputs.version }} → iomt.205716.xyz 🚀"
