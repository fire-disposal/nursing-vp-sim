name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify migration runs
        run: |
          export DATABASE_URL="sqlite:///test_migrate.db"
          uv run python -c "
          from database import init_db, engine
          init_db()
          print('Migration OK')
          "
        env:
          SECRET_KEY: ci-test-key-not-for-production
          DEEPSEEK_API_KEY: ""

      - name: Run tests
        run: uv run pytest -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npx biome check src/ --max-diagnostics 20

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
