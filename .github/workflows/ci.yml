name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nursing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple/

      - name: Verify migration runs (PostgreSQL)
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/nursing_test"
          uv run python -c "
          from core.database import init_db
          init_db()
          print('Migration OK')
          "
          # 验证迁移后表结构正确
          uv run python -c "
          from sqlalchemy import create_engine, inspect
          engine = create_engine('$DATABASE_URL')
          insp = inspect(engine)
          tables = insp.get_table_names()
          assert 'api_secrets' in tables, 'api_secrets table missing'
          assert 'llm_configs' in tables, 'llm_configs table missing'
          assert 'prompt_templates' in tables, 'prompt_templates table missing'
          print('Schema verified: core tables exist')
          # 验证 llm_configs 列（简化模型：档案管一切）
          cols = [c['name'] for c in insp.get_columns('llm_configs')]
          required = ['id','secret_id','model','purpose','status']
          for c in required:
              assert c in cols, f'llm_configs missing column: {c}'
          # 验证 api_secrets 列（profile 字段已迁移至此）
          acols = [c['name'] for c in insp.get_columns('api_secrets')]
          for c in ['status','degraded_reason','price_input_per_1m','consecutive_failures']:
              assert c in acols, f'api_secrets missing column: {c}'
          print('Columns verified')
          # 验证约束
          uq = [c['name'] for c in insp.get_unique_constraints('llm_configs')]
          assert any('profile_purpose' in u for u in uq), 'Unique constraint missing'
          print('Constraints verified')
          "
        env:
          SECRET_KEY: ci-test-key-not-for-production-use-only-in-ci-env
          DEEPSEEK_API_KEY: ""

      - name: Run tests
        run: uv run pytest -v --tb=short
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nursing_test
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/nursing_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
