name: PR Gate

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Commit message format (mirrors husky commit-msg) ────────────────────
  commit-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit message format
        run: |
          node -e '
          const { execSync } = require("child_process");
          const base = process.env.GITHUB_BASE_REF || "master";
          execSync(`git fetch origin ${base} --depth=1`, { stdio: "ignore" });
          const range = `origin/${base}..HEAD`;
          const log = execSync(`git log ${range} --no-merges --format="%H %s"`, { encoding: "utf-8" });
          const EMOJI_TYPES = {
            "✨": "feat","🐛": "fix","📝": "docs","♻️": "refactor",
            "🔧": "chore","✅": "test","🎨": "style","🚀": "ci",
            "📦": "build","⚡": "perf","🔀": "merge","🔒": "security",
            "🗃️": "db","⏪": "revert","🔥": "remove",
          };
          const emojis = Object.keys(EMOJI_TYPES).join("|");
          const types = [...new Set(Object.values(EMOJI_TYPES))].join("|");
          const re = new RegExp(`^(${emojis}) (${types})(\\\\(.+\\\\))?: .+`, "u");
          let fail = false;
          if (!log.trim()) { console.log("No non-merge commits"); process.exit(0); }
          for (const line of log.trim().split("\n")) {
            const [hash, ...rest] = line.split(" ");
            const msg = rest.join(" ");
            if (!re.test(msg)) {
              console.log(`::error title=Commit Format::${hash.substring(0,8)}: "${msg}" does not follow emoji format`);
              fail = true;
            }
          }
          if (fail) {
            console.log("");
            console.log("Expected: <emoji> <type>: <description>");
            console.log("Examples: ✨ feat: add feature | 🐛 fix: resolve crash | ♻️ refactor: simplify logic");
            process.exit(1);
          }
          console.log("✓ All commits follow emoji format");
          '

  # ── Migration sanity (mirrors husky pre-commit alembic + autogen check) ──
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Single head check
        run: |
          cd backend
          pip install -q alembic psycopg sqlalchemy >/dev/null 2>&1
          HEADS=$(alembic heads 2>&1)
          HEAD_COUNT=$(echo "$HEADS" | wc -l)
          if [ "$HEAD_COUNT" -gt 1 ]; then
            echo "::error::Multiple alembic heads detected"
            echo "$HEADS"
            exit 1
          fi
          echo "✓ Single head: $HEADS"

      - name: Migration directory contract (mirrors deploy.yml gate)
        run: |
          cd backend
          git fetch origin "${GITHUB_BASE_REF:-master}" --depth=1 2>/dev/null || true
          # --relative：cwd 是 backend/，git 默认输出仓库根相对路径（backend/...），
          # 直接喂 grep 会"文件不存在"→ data/ 迁移永远误报缺声明、ddl/ 的 op.execute 检查静默失效
          FILES=$(git diff --name-only --relative "origin/${GITHUB_BASE_REF:-master}"...HEAD -- 'migrations/versions/**/*.py' 2>/dev/null || true)
          [ -n "$FILES" ] || { echo "No migration files changed — skipping"; exit 0; }
          FAIL=0
          # 逐行读取：文件名含空格时 `for f in $FILES` 会按空白拆成伪路径（造成误报与漏检）
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              */versions/ddl/*)
                if grep -qE '^\s+op\.execute\(' "$f"; then
                  echo "::error::DDL migration $f contains op.execute() — 数据操作请拆到 versions/data/ (见 AGENTS.md)"
                  FAIL=1
                fi
                ;;
              */versions/data/*)
                if ! grep -qE "Manual override reason:\s*data_only" "$f"; then
                  echo "::error::Data migration $f 缺少 '# Manual override reason: data_only' (见 AGENTS.md)"
                  FAIL=1
                fi
                ;;
              *)
                echo "::error::Migration $f 必须位于 versions/ddl/ 或 versions/data/"
                FAIL=1
                ;;
            esac
          done <<< "$FILES"
          [ $FAIL -eq 0 ] || exit 1
          echo "✓ Migration directory contract OK"

      - name: Alembic roundtrip (only when migrations changed)
        run: |
          cd backend
          git fetch origin "${GITHUB_BASE_REF:-master}" --depth=1 2>/dev/null || true
          FILES=$(git diff --name-only "origin/${GITHUB_BASE_REF:-master}"...HEAD -- 'migrations/versions/**/*.py' 2>/dev/null || true)
          [ -n "$FILES" ] || { echo "No migration files changed — skipping roundtrip"; exit 0; }
          pip install -q alembic psycopg sqlalchemy >/dev/null 2>&1
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          alembic upgrade head || { echo "::error::alembic upgrade head failed"; exit 1; }
          alembic downgrade base || { echo "::error::alembic downgrade base failed — irreversible migration?"; exit 1; }
          alembic upgrade head || { echo "::error::alembic re-upgrade failed after full downgrade"; exit 1; }
          echo "✓ alembic roundtrip (base → head → base → head)"

  # ── Backend quality (mirrors husky pre-commit: ruff + ty) ───────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff format --check (changed files only)
        run: |
          BASE="origin/${GITHUB_BASE_REF:-master}"
          git fetch origin "${GITHUB_BASE_REF:-master}" --depth=1 2>/dev/null || true
          CHANGED=$(git diff --name-only ${BASE}...HEAD -- 'backend/**/*.py' 2>/dev/null | sed 's|^backend/||' || true)
          if [ -z "$CHANGED" ]; then
            echo "No Python files changed — skipping"
            exit 0
          fi
          echo "Checking: $CHANGED"
          # --force-exclude：显式路径同样遵守 pyproject 的 exclude（ruff/ty: migrations/versions/，ty 另含 tests/），
          # 与 `pnpm run check:backend` 口径一致，避免改迁移/测试文件时误红
          printf '%s\n' "$CHANGED" | xargs -d '\n' -r uv run ruff format --check --force-exclude

      - name: ruff check (changed files only)
        run: |
          BASE="origin/${GITHUB_BASE_REF:-master}"
          CHANGED=$(git diff --name-only ${BASE}...HEAD -- 'backend/**/*.py' 2>/dev/null | sed 's|^backend/||' || true)
          if [ -z "$CHANGED" ]; then
            echo "No Python files changed — skipping"
            exit 0
          fi
          # --force-exclude：显式路径同样遵守 pyproject 的 exclude（ruff/ty: migrations/versions/，ty 另含 tests/），
          # 与 `pnpm run check:backend` 口径一致，避免改迁移/测试文件时误红
          printf '%s\n' "$CHANGED" | xargs -d '\n' -r uv run ruff check --force-exclude

      - name: ty check (changed files only)
        run: |
          BASE="origin/${GITHUB_BASE_REF:-master}"
          CHANGED=$(git diff --name-only ${BASE}...HEAD -- 'backend/**/*.py' 2>/dev/null | sed 's|^backend/||' || true)
          if [ -z "$CHANGED" ]; then
            echo "No Python files changed — skipping"
            exit 0
          fi
          # --force-exclude：显式路径同样遵守 pyproject 的 exclude（ruff/ty: migrations/versions/，ty 另含 tests/），
          # 与 `pnpm run check:backend` 口径一致，避免改迁移/测试文件时误红
          printf '%s\n' "$CHANGED" | xargs -d '\n' -r uv run ty check --force-exclude

      - name: case-audit (病例数据健康门禁 — 0 error 才放行)
        run: uv run python ../scripts/case-audit.py --json

      - name: api:spec (check openapi.json is in sync)
        run: |
          uv run python -c "
          import json
          from main import app
          spec = app.openapi()
          with open('../openapi.json', 'w', encoding='utf-8') as f:
              json.dump(spec, f, ensure_ascii=False, indent=2)
          print('openapi.json regenerated')
          "
          cd ..
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::openapi.json is out of sync — run 'pnpm run api:update' and commit the changes"
            exit 1
          fi
          echo "✓ openapi.json is in sync"

  # ── Frontend quality (biome + tsc + vitest 全量测试) ────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: biome lint (changed files only)
        run: |
          BASE="origin/${GITHUB_BASE_REF:-master}"
          git fetch origin "${GITHUB_BASE_REF:-master}" --depth=1 2>/dev/null || true
          CHANGED=$(git diff --name-only ${BASE}...HEAD -- 'frontend/src/**/*.{ts,tsx}' 'frontend/src/**/*.{js,jsx}' 2>/dev/null | sed 's|^frontend/||' || true)
          if [ -z "$CHANGED" ]; then
            echo "No frontend source files changed — skipping"
            exit 0
          fi
          echo "Checking: $CHANGED"
          pnpm biome lint $CHANGED --max-diagnostics 50

      - name: tsc (full project — type safety requires holistic check)
        run: pnpm tsc --noEmit

      - name: vitest (全量前端测试)
        run: pnpm test

      - name: api:generate (check frontend types in sync)
        run: |
          pnpm openapi-typescript ../openapi.json -o src/api/api-types.gen.ts
          cd ..
          if ! git diff --exit-code -- frontend/src/api/api-types.gen.ts; then
            echo "::error::api-types.gen.ts is out of sync — run 'pnpm run api:update' and commit the changes"
            exit 1
          fi
          echo "✓ api-types.gen.ts is in sync"
