name: PR Merge — Tag & Deploy

run-name: "[PR-Staging] Auto tag → deploy"

on:
  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: deploy-pr-staging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Format merge commit message
        run: |
          HEAD_MSG=$(git log -1 --format="%s" HEAD)
          if echo "$HEAD_MSG" | grep -q "^Merge pull request"; then
            # "Merge pull request #32 from fire-disposal/fix/bug-fixes" → "#32 — fix/bug-fixes-and-diagnose"
            PR_ID=$(echo "$HEAD_MSG" | sed -n 's/^Merge pull request #\([0-9]*\) .*/\1/p')
            BRANCH=$(echo "$HEAD_MSG" | sed -n 's/^Merge pull request #[0-9]* from [^/]*\/\(.*\)/\1/p')
            NEW_MSG="🔀 merge: #${PR_ID} — ${BRANCH}"
            echo "Formatting: $HEAD_MSG → $NEW_MSG"
            git commit --amend -m "$NEW_MSG" --no-verify
            git push --force-with-lease origin master
            echo "✓ Merge commit formatted"
          else
            echo "Not a merge commit — skipping"
          fi

      - name: Create and push tag
        run: node .husky/_/auto-tag.mjs --push
