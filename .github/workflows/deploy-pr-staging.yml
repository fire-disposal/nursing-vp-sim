name: PR Merge — Tag & Deploy

run-name: "[PR-Staging] Auto tag → deploy"

on:
  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: deploy-pr-staging
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # CI 环境无 husky hooks，本地 pre-push 的 alembic roundtrip（base→head→base→head）
  # 在这里等价复刻，防不可逆迁移/无法上线的迁移进入 tag 部署链。
  validate-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Alembic roundtrip (upgrade head → downgrade base → upgrade head)
        run: |
          cd backend
          pip install -q alembic psycopg sqlalchemy >/dev/null 2>&1
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          alembic upgrade head || { echo "::error::alembic upgrade head failed"; exit 1; }
          alembic downgrade base || { echo "::error::alembic downgrade base failed — irreversible migration?"; exit 1; }
          alembic upgrade head || { echo "::error::alembic re-upgrade failed after full downgrade"; exit 1; }
          echo "✓ alembic full upgrade/downgrade roundtrip (base → head → base → head)"

  deploy:
    needs: validate-migrations
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: node .husky/_/auto-tag.mjs --push
