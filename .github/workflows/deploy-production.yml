name: Deploy to Production

run-name: "[Production] Deploy ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Deploy version, e.g. v2026.06.20-4 or 2026.06.20-4'
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Assemble testing checklist
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          VER="${{ steps.version.outputs.value }}"
          PROD_VER=""

          if [ -n "$HOST" ] && [ -n "$USER" ]; then
            mkdir -p ~/.ssh
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            PROD_VER=$(ssh "$USER@$HOST" "tail -1 /opt/nursing-vp-sim/.version-history-prod 2>/dev/null | cut -d'|' -f1" 2>/dev/null || echo "")
          fi

          if [ -z "$PROD_VER" ]; then
            echo "::warning::Cannot determine production version, skipping checklist assembly"
            exit 0
          fi

          echo "  production: v$PROD_VER"
          echo "  target:     v$VER"

          TAGS=$(git tag --sort=version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' \
            | awk "/^v$PROD_VER\$/{found=1; next} /^v$VER\$/{exit} found")

          echo ""
          echo "=== COMBINED CHECKLIST ==="
          echo ""
          echo "# $VER 合并测试清单"
          echo ""
          echo "**版本**: v$PROD_VER → v$VER"
          echo "**环境**: https://test.205716.xyz"
          echo ""
          echo "---"
          echo ""

          for TAG in v$PROD_VER $TAGS v$VER; do
            MONTH=$(echo "${TAG#v}" | cut -d. -f1-2)
            MONTHLY_FILE="docs/testing/${MONTH}/checklist-${TAG}.md"
            FLAT_FILE="docs/testing/checklist-${TAG}.md"
            FILE=$( [ -f "$MONTHLY_FILE" ] && echo "$MONTHLY_FILE" || echo "$FLAT_FILE" )
            if [ -f "$FILE" ]; then
              BODY=$(grep -v '^#' "$FILE" | grep -v '^\*\*版本\*\*' | grep -v '^\*\*环境\*\*' | grep -v '^$' | tr -d '[:space:]')
              if [ -n "$BODY" ] && [ "$BODY" != "无需测试" ]; then
                echo "<!-- from $FILE -->"
                grep -v '^#' "$FILE" | grep -v '^\*\*版本\*\*' | grep -v '^\*\*环境\*\*' || true
                echo ""
              fi
            fi
          done

          echo "=== END CHECKLIST ==="

      - name: Normalize owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Normalize version
        id: version
        run: |
          RAW="${{ inputs.version }}"
          CLEAN="${RAW#v}"
          echo "value=$CLEAN" >> $GITHUB_OUTPUT
          echo ">> version: $CLEAN"

      - name: Write change summary
        run: |
          VER="${{ steps.version.outputs.value }}"
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          PROD_VER=""
          if [ -n "$HOST" ] && [ -n "$USER" ]; then
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            PROD_VER=$(ssh "$USER@$HOST" "tail -1 /opt/nursing-vp-sim/.version-history-prod 2>/dev/null | cut -d'|' -f1" 2>/dev/null || echo "")
          fi
          {
            echo "# Production Deploy v$VER"
            echo ""
            echo "**Previous**: v$PROD_VER  |  **Target**: v$VER"
            echo ""
            echo "## Changes"
            echo '```'
            if [ -n "$PROD_VER" ]; then
              git log "v$PROD_VER..v$VER" --oneline --no-merges 2>/dev/null || echo "(no tags found)"
            else
              echo "(first deploy or no version history)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Production
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          VER="${{ steps.version.outputs.value }}"
          DEPLOY_DIR="/opt/nursing-vp-sim"

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp deploy/docker-compose.prod.yml "$USER@$HOST":$DEPLOY_DIR/docker-compose.yml
          scp deploy/rollback.sh "$USER@$HOST":$DEPLOY_DIR/rollback.sh

          echo ">> Deploy monitor scripts"
          ssh "$USER@$HOST" "mkdir -p /opt/monitor"
          scp deploy/monitor/monitor.py "$USER@$HOST":/opt/monitor/
          scp deploy/monitor/daily_report.py "$USER@$HOST":/opt/monitor/
          scp deploy/monitor/weekly_report.py "$USER@$HOST":/opt/monitor/
          scp deploy/monitor/_env.py "$USER@$HOST":/opt/monitor/

          echo ">> Deploy nginx config"
          scp deploy/nginx/iomt.205716.xyz.conf "$USER@$HOST":/etc/nginx/sites-enabled/iomt.205716.xyz.conf
          scp deploy/nginx/snippets/block-scanners.conf "$USER@$HOST":/etc/nginx/snippets/block-scanners.conf
          ssh "$USER@$HOST" "sudo nginx -t && sudo nginx -s reload || echo 'nginx reload skipped (config test failed)'"

          ssh "$USER@$HOST" << DEPLOY
            set -e
            cd /opt/nursing-vp-sim
            chmod +x rollback.sh
            printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            BAK="/opt/nursing-vp-sim/backups/pre-deploy-\$(date +%Y%m%d-%H%M%S).sql"
            echo ">> Backup DB"
            mkdir -p /opt/nursing-vp-sim/backups
            if docker exec nursing-db pg_dump -U nursing -d nursing_vp > "\$BAK" 2>/dev/null; then
              echo "  ✓ backup: \$BAK"
            else
              echo "::error::备份失败，停止部署"
              exit 1
            fi

            OLD_BACKEND=\$(docker inspect --format '{{.Config.Image}}' nursing-vp-sim-backend-1 2>/dev/null || echo "")
            OLD_VER=\$(echo "\$OLD_BACKEND" | rev | cut -d: -f1 | rev)
            echo ">> Current production: v\$OLD_VER"

            echo ">> Deploy v$VER"
            STAGING_VER=\$(docker inspect --format '{{.Config.Image}}' nursing-backend-staging 2>/dev/null | rev | cut -d: -f1 | rev || echo "none")

            if [ "\$STAGING_VER" = "none" ]; then
              echo "⚠ no staging running, allowing direct deploy"
            elif [ "\${STAGING_VER#v}" != "$VER" ]; then
              echo "✗ v$VER ≠ staging (v\$STAGING_VER). Must match exactly. Deploy to Staging first."
              exit 1
            fi
            echo "✓ v$VER matches staging. Promoting to production..."

            IMAGE_VERSION=$VER docker compose -f docker-compose.yml --env-file .env pull || {
              echo "  ⚠ First pull attempt failed, retrying after 10s..."
              sleep 10
              IMAGE_VERSION=$VER docker compose -f docker-compose.yml --env-file .env pull || {
                echo "  ⚠ Second pull attempt failed, retrying after 30s..."
                sleep 30
                IMAGE_VERSION=$VER docker compose -f docker-compose.yml --env-file .env pull || exit 1
              }
            }
            IMAGE_VERSION=$VER docker compose -f docker-compose.yml --env-file .env up -d --remove-orphans

            echo ">> Health check..."
            OK=false
            for i in \$(seq 1 30); do
              S=\$(docker inspect --format '{{.State.Health.Status}}' nursing-vp-sim-backend-1 2>/dev/null || echo "")
              case "\$S" in
                healthy) echo "  ✓ healthy (\$((i * 2))s)"; OK=true; break ;;
                unhealthy)
                  echo "  ✗ unhealthy! Rolling back..."
                  echo "  >> attempting alembic downgrade before rolling back image..."
                  docker compose -f docker-compose.yml --env-file .env exec -T backend alembic downgrade -1 2>/dev/null \
                    || echo "  ⚠ downgrade failed (container may be too broken, will be dropped)"
                  if [ -n "\$OLD_VER" ]; then
                    IMAGE_VERSION=\$OLD_VER docker compose -f docker-compose.yml --env-file .env up -d
                    echo "  ⚠ rolled back to v\$OLD_VER"
                  else
                    echo "  ✗ no previous version to roll back to"
                  fi
                  exit 1 ;;
              esac
              sleep 2
            done
            [ "\$OK" = true ] || { echo "  ✗ timeout (unhealthy?)"; exit 1; }

            docker exec nursing-vp-sim-backend-1 curl -sf http://localhost:8000/api/health
            echo "$VER|\$(date -u +%Y-%m-%dT%H:%M:%SZ)|ghcr.io/${{ steps.owner.outputs.value }}/nursing-vp-sim-backend:$VER|ghcr.io/${{ steps.owner.outputs.value }}/nursing-vp-sim-frontend:$VER|\$(docker exec nursing-vp-sim-backend-1 alembic current 2>/dev/null | head -1 | awk '{print \$1}')" >> .version-history-prod
            tail -50 .version-history-prod > .version-history-prod.tmp && mv .version-history-prod.tmp .version-history-prod
            echo ">> Production v$VER ✓"
            docker image prune -f
          DEPLOY

      - name: "✅ Production"
        run: echo "v${{ steps.version.outputs.value }} → iomt.205716.xyz 🚀"
