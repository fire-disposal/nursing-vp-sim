name: Build & Deploy to Staging

run-name: "[Staging] Deploy ${{ inputs.version || github.ref_name }}"

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 2026.06.16-1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate alembic migrations
        run: |
          cd backend
          pip install -q alembic psycopg sqlalchemy >/dev/null 2>&1

          # Rule 1: single head only
          HEADS=$(alembic heads 2>&1)
          HEAD_COUNT=$(echo "$HEADS" | wc -l)
          if [ "$HEAD_COUNT" -gt 1 ]; then
            echo "::error::Multiple alembic heads detected"
            echo "$HEADS"
            exit 1
          fi
          echo "✓ Single head: $HEADS"

          # Rule 2: HEAD migration must obey the directory contract (真实不变量，非"自动生成标记")
          #   versions/ddl/  → schema-only, 禁止 op.execute()（数据操作放 data/）
          #   versions/data/ → 需声明 "# Manual override reason: data_only"
          HEAD_REV=$(echo "$HEADS" | head -1 | sed 's/ *(head)$//')
          HEAD_FILE=$(grep -rl --include="*.py" "Revision ID: $HEAD_REV" migrations/versions/ | head -1)
          if [ -z "$HEAD_FILE" ]; then
            echo "::warning::Could not find HEAD migration file for $HEAD_REV"
            exit 0
          fi
          echo "  checking: $HEAD_FILE"

          case "$HEAD_FILE" in
            */versions/ddl/*)
              if grep -qE '^\s+op\.execute\(' "$HEAD_FILE"; then
                echo "::error::DDL migration $(basename "$HEAD_FILE") contains op.execute() — 数据操作请拆到 versions/data/ 迁移 (见 AGENTS.md)"
                exit 1
              fi
              echo "✓ DDL migration — schema-only (no data ops)"
              ;;
            */versions/data/*)
              if grep -qE "Manual override reason:\s*data_only" "$HEAD_FILE"; then
                echo "✓ Data migration — reason: data_only"
              else
                echo "::error::Data migration $(basename "$HEAD_FILE") 缺少 '# Manual override reason: data_only' (见 AGENTS.md)"
                exit 1
              fi
              ;;
            *)
              echo "::error::Migration $(basename "$HEAD_FILE") 必须位于 versions/ddl/ 或 versions/data/"
              exit 1
              ;;
          esac
          echo "✓ Migration check passed"

      - name: Normalize owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/nursing-vp-sim
          tags: type=match,pattern=v(.*),group=1

      - name: Resolve version
        id: resolve_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            CLEAN="${RAW#v}"
            echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write change summary
        id: change_summary
        run: |
          VER="${{ steps.resolve_version.outputs.version }}"
          PREV=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | head -2 | tail -1)
          COMMITS=$(git log "$PREV..v$VER" --oneline --no-merges 2>/dev/null || echo "")
          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          {
            echo "# Staging Deploy v$VER"
            echo ""
            echo "**Previous**: $PREV  |  **Target**: v$VER"
            echo ""
            echo "## Changes"
            echo '```'
            git log "$PREV..v$VER" --oneline --no-merges || echo "(first deploy or no previous tag)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/nursing-vp-sim-backend:${{ steps.resolve_version.outputs.version }}
          build-args: APP_VERSION=${{ steps.resolve_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/nursing-vp-sim-frontend:${{ steps.resolve_version.outputs.version }}
          build-args: APP_VERSION=${{ steps.resolve_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Staging
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          VER="${{ steps.resolve_version.outputs.version }}"

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp deploy/docker-compose.staging.yml "$USER@$HOST":/opt/nursing-vp-sim/docker-compose.staging.yml
          scp deploy/db-backup.sh "$USER@$HOST":/opt/nursing-vp-sim/deploy/db-backup.sh

          echo ">> Deploy monitor scripts"
          ssh "$USER@$HOST" "mkdir -p /opt/monitor"
          scp deploy/monitor/monitor.py "$USER@$HOST":/opt/monitor/
          scp deploy/monitor/daily_report.py "$USER@$HOST":/opt/monitor/
          scp deploy/monitor/weekly_report.py "$USER@$HOST":/opt/monitor/
          scp deploy/monitor/_env.py "$USER@$HOST":/opt/monitor/

          echo ">> Deploy nginx config"
          scp deploy/nginx/test.205716.xyz.conf "$USER@$HOST":/etc/nginx/sites-enabled/test.205716.xyz.conf
          scp deploy/nginx/snippets/block-scanners.conf "$USER@$HOST":/etc/nginx/snippets/block-scanners.conf
          ssh "$USER@$HOST" "sudo nginx -t && sudo nginx -s reload || echo 'nginx reload skipped (config test failed)'"

          ssh "$USER@$HOST" << DEPLOY
            set -e
            cd /opt/nursing-vp-sim
            printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo ">> Staging v$VER"

            IMAGE_VERSION=$VER docker compose -f docker-compose.staging.yml --env-file .env -p nursing-vp-staging pull || {
              echo "  ⚠ First pull attempt failed, retrying after 10s..."
              sleep 10
              IMAGE_VERSION=$VER docker compose -f docker-compose.staging.yml --env-file .env -p nursing-vp-staging pull || {
                echo "  ⚠ Second pull attempt failed, retrying after 30s..."
                sleep 30
                IMAGE_VERSION=$VER docker compose -f docker-compose.staging.yml --env-file .env -p nursing-vp-staging pull || exit 1
              }
            }

            OLD_IMG=\$(docker inspect --format '{{.Config.Image}}' nursing-backend-staging 2>/dev/null || echo "")
            IMAGE_VERSION=$VER docker compose -f docker-compose.staging.yml --env-file .env -p nursing-vp-staging up -d --remove-orphans
            echo ">> Health check..."
            OK=false
            for i in \$(seq 1 30); do
              S=\$(docker inspect --format '{{.State.Health.Status}}' nursing-backend-staging 2>/dev/null || echo "")
              case "\$S" in
                healthy) echo "  ✓ healthy (\$((i * 2))s)"; OK=true; break ;;
                unhealthy)
                  echo "  ✗ unhealthy! Rolling back..."
                  echo "  >> attempting alembic downgrade before rolling back image..."
                  docker compose -f docker-compose.staging.yml --env-file .env -p nursing-vp-staging exec -T backend alembic downgrade -1 2>/dev/null \
                    || echo "  ⚠ downgrade failed (container may be too broken, will be dropped)"
                  if [ -n "\$OLD_IMG" ]; then
                    OLD_VER=\$(echo "\$OLD_IMG" | rev | cut -d: -f1 | rev)
                    IMAGE_VERSION=\$OLD_VER docker compose -f docker-compose.staging.yml --env-file .env -p nursing-vp-staging up -d
                    echo "  ⚠ rolled back to \$OLD_VER"
                  fi
                  exit 1 ;;
              esac
              sleep 2
            done
            [ "\$OK" = true ] || { echo "  ✗ timeout"; exit 1; }
            curl -sf http://127.0.0.1:9081/api/health && echo ">> Staging v$VER ✓"
            echo "$VER|\$(date -u +%Y-%m-%dT%H:%M:%SZ)|ghcr.io/${{ steps.owner.outputs.value }}/nursing-vp-sim-backend:$VER|ghcr.io/${{ steps.owner.outputs.value }}/nursing-vp-sim-frontend:$VER|\$(docker exec nursing-backend-staging alembic current 2>/dev/null | head -1 | awk '{print \$1}')" >> .version-history-staging
            tail -50 .version-history-staging > .version-history-staging.tmp && mv .version-history-staging.tmp .version-history-staging
            docker image prune -f
          DEPLOY

      - name: Publish dev report (non-blocking)
        continue-on-error: true
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Generate report from full git history on CI runner
          cd backend
          python -m ensurepip --upgrade 2>/dev/null || true
          pip install -q uv 2>/dev/null || true
          python -m uv run python ../scripts/dev-report.py --output ../frontend/public/report.html 2>&1 || {
            echo "⚠ Report generation failed — skipping publish"
            exit 0
          }

          # SCP to staging server and inject into frontend container
          scp ../frontend/public/report.html "$USER@$HOST":/tmp/report.html 2>/dev/null || {
            echo "⚠ SCP failed — skipping publish"
            exit 0
          }
          ssh "$USER@$HOST" "
            docker cp /tmp/report.html nursing-frontend-staging:/usr/share/nginx/html/report.html 2>/dev/null && \
            rm -f /tmp/report.html && \
            echo '✓ report.html published to container' || echo '⚠ docker cp failed'
          " 2>/dev/null
          echo "✓ → https://test.205716.xyz/report.html"

      - name: Publish checklist to Feishu
        if: vars.FEISHU_APP_ID != ''
        env:
          FEISHU_APP_ID: ${{ vars.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_TOKEN: ${{ vars.FEISHU_BITABLE_TOKEN }}
          FEISHU_TABLE_ID: ${{ vars.FEISHU_TABLE_ID }}
          FEISHU_CHAT_ID: ${{ vars.FEISHU_CHAT_ID }}
          FEISHU_BITABLE_URL: ${{ vars.FEISHU_BITABLE_URL }}
        run: |
          VER="${{ steps.resolve_version.outputs.version }}"
          node scripts/gen-combined-checklist.mjs --feishu -t="v${VER}" 2>&1 || echo "⚠ feishu publish failed (non-blocking)"

      - name: Notify DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DEPLOY_VERSION: ${{ steps.resolve_version.outputs.version }}
          DEPLOY_ENV: staging
          DEPLOY_URL: https://test.205716.xyz
          COMMITS: ${{ steps.change_summary.outputs.commits }}
        run: |
          if [ -z "$DINGTALK_WEBHOOK" ]; then
            echo "⚠ DINGTALK_WEBHOOK not set — skipping"
            exit 0
          fi
          node scripts/notify-deploy.mjs || echo "⚠ dingtalk notify failed"

      - name: "✅ Staging"
        run: echo "v${{ steps.resolve_version.outputs.version }} → test.205716.xyz 🧪"
