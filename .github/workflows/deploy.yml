name: Deploy (single instance)

# 单实例部署流水线 —— 取代已归档的 deploy-staging.yml + deploy-production.yml。
#
# 设计要点（保留自旧双栈，逐条有出处）：
#   1. 人工闸门：deploy job 绑定 GitHub Environment `production`，需 reviewer 批准才执行
#      （旧 prod 流水线靠"人来点 workflow_dispatch"；单实例后 tag 推送也会触发，
#       必须由环境审批承担红线，见 archive/README.md）。
#   2. 迁移门禁：单 head + ddl/data 目录契约（保留自 deploy-staging.yml）。
#   3. 部署前数据库备份，失败即停（保留自 deploy-production.yml，fail-closed）。
#   4. 健康检查 + 自动回滚（含 alembic 回退旧 revision）（保留自 deploy-staging.yml）。
#   5. 版本历史文件 + 稳定性感知镜像清理 + 部署横幅 + 钉钉通知 + 开发报告发布。
#   6. 部署后 /api/diagnose 冒烟（新增：让"部署成功"有业务侧证据）。
#
# 触发：推送 vYYYY.MM.DD-N tag（由 `pnpm run tag` 产生），或手动 dispatch 指定历史版本。

run-name: "Deploy ${{ inputs.version || github.ref_name }}"

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g. 2026.09.14-1 or v2026.09.14-1)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: /opt/nursing-vp-sim
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 人工闸门：在仓库 Settings → Environments 为 production 配置 required reviewers。
    environment: production
    steps:
      # workflow_dispatch 输入历史版本时，必须 checkout 对应 tag 的源码，
      # 否则会拿 master 代码冒充旧版本镜像（tag push 触发时 github.ref 即 tag）
      - name: Resolve ref (dispatch → version tag)
        id: ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          RAW="${{ inputs.version }}"
          CLEAN="${RAW#v}"
          echo "ref=refs/tags/v${CLEAN}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref || github.ref }}

      # 应用保持目标 tag；新增备份工具取执行本次工作流的不可变提交，不依赖旧 tag 或浮动分支。
      - name: Checkout workflow backup tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-ops
          sparse-checkout: |
            /deploy/pre-deploy-backup.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Preflight local deploy inputs
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            Dockerfile.backend
            Dockerfile.frontend
            deploy/docker-compose.prod.yml
            deploy/rollback.sh
            deploy/db-backup.sh
            deploy/db-restore.sh
            .deploy-ops/deploy/pre-deploy-backup.sh
            deploy/prune-images.sh
            deploy/nginx/iomt.205716.xyz.conf
            deploy/nginx/snippets/block-scanners.conf
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" || ! -r "$file" || ! -s "$file" ]]; then
              echo "::error::Required deploy input missing, unreadable or empty: $file"
              exit 1
            fi
          done
          for file in deploy/rollback.sh deploy/db-backup.sh deploy/db-restore.sh \
            .deploy-ops/deploy/pre-deploy-backup.sh deploy/prune-images.sh; do
            bash -n "$file"
          done

      - name: Validate alembic migrations
        run: |
          cd backend
          pip install -q alembic psycopg sqlalchemy >/dev/null 2>&1

          # Rule 1: single head only
          HEADS=$(alembic heads 2>&1)
          HEAD_COUNT=$(echo "$HEADS" | wc -l)
          if [ "$HEAD_COUNT" -gt 1 ]; then
            echo "::error::Multiple alembic heads detected"
            echo "$HEADS"
            exit 1
          fi
          echo "✓ Single head: $HEADS"

          # Rule 2: HEAD migration must obey the directory contract
          #   versions/ddl/  → schema-only, 禁止 op.execute()（数据操作放 data/）
          #   versions/data/ → 需声明 "# Manual override reason: data_only"
          HEAD_REV=$(echo "$HEADS" | head -1 | sed 's/ *(head)$//')
          HEAD_FILE=$(grep -rl --include="*.py" "Revision ID: $HEAD_REV" migrations/versions/ | head -1)
          if [ -z "$HEAD_FILE" ]; then
            echo "::warning::Could not find HEAD migration file for $HEAD_REV"
            exit 0
          fi
          echo "  checking: $HEAD_FILE"

          case "$HEAD_FILE" in
            */versions/ddl/*)
              if grep -qE '^\s+op\.execute\(' "$HEAD_FILE"; then
                echo "::error::DDL migration $(basename "$HEAD_FILE") contains op.execute() — 数据操作请拆到 versions/data/ 迁移 (见 AGENTS.md)"
                exit 1
              fi
              echo "✓ DDL migration — schema-only (no data ops)"
              ;;
            */versions/data/*)
              if grep -qE "Manual override reason:\s*data_only" "$HEAD_FILE"; then
                echo "✓ Data migration — reason: data_only"
              else
                echo "::error::Data migration $(basename "$HEAD_FILE") 缺少 '# Manual override reason: data_only' (见 AGENTS.md)"
                exit 1
              fi
              ;;
            *)
              echo "::error::Migration $(basename "$HEAD_FILE") 必须位于 versions/ddl/ 或 versions/data/"
              exit 1
              ;;
          esac
          echo "✓ Migration check passed"

      - name: Normalize owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/nursing-vp-sim
          tags: type=match,pattern=v(.*),group=1

      - name: Resolve version
        id: resolve_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            CLEAN="${RAW#v}"
            echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write change summary
        id: change_summary
        run: |
          VER="${{ steps.resolve_version.outputs.version }}"
          PREV=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | head -2 | tail -1)
          COMMITS=$(git log "$PREV..v$VER" --oneline --no-merges 2>/dev/null || echo "")
          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          {
            echo "# Deploy v$VER"
            echo ""
            echo "**Previous**: $PREV  |  **Target**: v$VER"
            echo ""
            echo "## Changes"
            echo '```'
            git log "$PREV..v$VER" --oneline --no-merges || echo "(first deploy or no previous tag)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/nursing-vp-sim-backend:${{ steps.resolve_version.outputs.version }}
          build-args: APP_VERSION=${{ steps.resolve_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/nursing-vp-sim-frontend:${{ steps.resolve_version.outputs.version }}
          build-args: APP_VERSION=${{ steps.resolve_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Verify images exist in registry
        run: |
          OWNER="${{ steps.owner.outputs.value }}"
          VER="${{ steps.resolve_version.outputs.version }}"
          for repo in nursing-vp-sim-backend nursing-vp-sim-frontend; do
            if docker manifest inspect "${{ env.REGISTRY }}/$OWNER/$repo:$VER" >/dev/null 2>&1; then
              echo "  ✓ $repo:$VER"
            else
              echo "::error::$repo:$VER 不存在于镜像仓库——构建/推送失败，或版本号不符"
              exit 1
            fi
          done

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Activate deploy warning banner
        run: |
          curl -s -X POST "https://iomt.205716.xyz/api/admin/deploy-warning?token=${{ secrets.DEPLOY_WARNING_TOKEN }}" \
            -G --data-urlencode "message=系统即将更新到 ${{ steps.resolve_version.outputs.version }}，预计 3-5 分钟，请保存当前进度。" \
            || echo "Warning: could not activate deploy banner (server may be down)"

      - name: Deploy
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          VER="${{ steps.resolve_version.outputs.version }}"
          OWNER="${{ steps.owner.outputs.value }}"

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh "$USER@$HOST" "mkdir -p $DEPLOY_DIR/deploy"
          scp deploy/docker-compose.prod.yml "$USER@$HOST":$DEPLOY_DIR/docker-compose.yml
          scp deploy/rollback.sh "$USER@$HOST":$DEPLOY_DIR/rollback.sh
          scp deploy/db-backup.sh "$USER@$HOST":$DEPLOY_DIR/deploy/db-backup.sh
          scp deploy/db-restore.sh "$USER@$HOST":$DEPLOY_DIR/deploy/db-restore.sh
          scp .deploy-ops/deploy/pre-deploy-backup.sh "$USER@$HOST":$DEPLOY_DIR/deploy/pre-deploy-backup.sh
          scp deploy/prune-images.sh "$USER@$HOST":$DEPLOY_DIR/deploy/prune-images.sh

          echo ">> Deploy nginx config"
          # 先暂存候选文件 → 备份原文件 → 安装 → 完整 nginx -t → 校验通过才 reload。
          # 任一步失败都还原磁盘上的原配置并以非零退出（不再吞掉 nginx -t 失败让流程继续）。
          NGINX_STAGE="$(ssh "$USER@$HOST" "mktemp -d '/tmp/nginx-deploy-${{ github.run_id }}-${{ github.run_attempt }}-XXXXXX'")"
          if ! scp deploy/nginx/iomt.205716.xyz.conf "$USER@$HOST":"$NGINX_STAGE/iomt.205716.xyz.conf" ||
             ! scp deploy/nginx/snippets/block-scanners.conf "$USER@$HOST":"$NGINX_STAGE/block-scanners.conf"; then
            ssh "$USER@$HOST" "rm -rf -- '$NGINX_STAGE'"
            exit 1
          fi
          ssh "$USER@$HOST" "bash -s -- '$NGINX_STAGE'" <<'NGINX_CFG_DEPLOY'
          set -euo pipefail

          STAGE="${1:-}"
          case "$STAGE" in
            /tmp/nginx-deploy-*) ;;
            *) echo "::error::nginx 配置暂存目录异常: '$STAGE'"; exit 1 ;;
          esac
          [ -d "$STAGE" ] || { echo "::error::nginx 配置暂存目录不存在: $STAGE"; exit 1; }

          # 只部署这两个仓库自有文件；其它 vhost / snippets 一律不碰。
          VHOST_CONF=/etc/nginx/sites-enabled/iomt.205716.xyz.conf
          SNIP_CONF=/etc/nginx/snippets/block-scanners.conf
          BACKUP="$STAGE/backup"

          KEEP_BACKUP=no
          cleanup() {
            if [ "$KEEP_BACKUP" = yes ]; then
              echo "::error::nginx 配置恢复未完成，保留备份目录供人工恢复: $STAGE" >&2
            else
              sudo rm -rf -- "$STAGE"
            fi
          }
          trap cleanup EXIT

          # sites-enabled 里通常是符号链接：解析出真实文件，备份/安装/回滚都作用于同一个真实文件，
          # 不会把符号链接本身换成普通文件；解析结果落在 /etc/nginx 之外就直接拒绝，避免覆盖无关文件。
          resolve_target() {
            local p="$1" r
            r="$(readlink -m -- "$p")" || return 1
            case "$r" in
              /etc/nginx/*) ;;
              *) echo "::error::$p 解析为 $r——不在 /etc/nginx 下，拒绝安装" >&2; return 1 ;;
            esac
            [ ! -d "$r" ] || { echo "::error::$p 解析为目录: $r" >&2; return 1; }
            printf '%s' "$r"
          }

          REAL_VHOST="$(resolve_target "$VHOST_CONF")" || exit 1
          REAL_SNIP="$(resolve_target "$SNIP_CONF")" || exit 1

          # 备份原文件（含「原本不存在」的情况——回滚时改为删除新装文件）
          mkdir -p "$BACKUP"
          VHOST_EXISTED=no
          SNIP_EXISTED=no
          if [ -e "$REAL_VHOST" ]; then
            sudo cp -a -- "$REAL_VHOST" "$BACKUP/vhost.conf"
            VHOST_EXISTED=yes
          fi
          if [ -e "$REAL_SNIP" ]; then
            sudo cp -a -- "$REAL_SNIP" "$BACKUP/snippet.conf"
            SNIP_EXISTED=yes
          fi

          restore_previous() {
            local failed=0
            echo ">> 回滚 nginx 配置到部署前状态"
            if [ "$VHOST_EXISTED" = yes ]; then
              sudo cp -a -- "$BACKUP/vhost.conf" "$REAL_VHOST" || failed=1
            else
              sudo rm -f -- "$REAL_VHOST" || failed=1
            fi
            if [ "$SNIP_EXISTED" = yes ]; then
              sudo cp -a -- "$BACKUP/snippet.conf" "$REAL_SNIP" || failed=1
            else
              sudo rm -f -- "$REAL_SNIP" || failed=1
            fi
            sudo nginx -t || failed=1
            if [ "$failed" -ne 0 ]; then KEEP_BACKUP=yes; fi
            return "$failed"
          }

          sudo cp -- "$STAGE/iomt.205716.xyz.conf" "$REAL_VHOST" || { echo "::error::安装 $VHOST_CONF 失败"; restore_previous; exit 1; }
          sudo cp -- "$STAGE/block-scanners.conf" "$REAL_SNIP" || { echo "::error::安装 $SNIP_CONF 失败"; restore_previous; exit 1; }

          if ! sudo nginx -t; then
            echo "::error::nginx -t 校验失败——恢复原配置，不执行 reload"
            restore_previous
            exit 1
          fi
          if ! sudo nginx -s reload; then
            echo "::error::nginx -s reload 失败——恢复原磁盘配置"
            restore_previous
            exit 1
          fi
          echo "  ✓ nginx 配置已校验并 reload"
          NGINX_CFG_DEPLOY

          ssh "$USER@$HOST" 'bash -s' << DEPLOY
            set -e
            cd $DEPLOY_DIR

            # 部署窗口标记：监控在此期间跳过健康检查，避免每次发布都误报一次。
            # 契约见 server-ops 仓 README；trap 保证失败退出也会摘掉标记。
            touch /opt/server-ops/monitor/.deploying
            trap 'rm -f /opt/server-ops/monitor/.deploying' EXIT
            printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo ">> Deploy v$VER"

            # —— 部署前备份（失败即停，绝不带着未知状态上车）——
            # 统一入口：宿主备份层 CLI 按 datasets.toml 的 nursing-predeploy 声明执行
            # （bash deploy/pre-deploy-backup.sh backup）+ 代记账本 + 跑声明的 verify；
            # 工具由本次工作流的不可变 github.workflow_sha 提供，应用仍构建自目标 tag。
            # 旧 tag 缺少新工具不能成为跳过备份的理由；宿主备份层缺失是显式失败，不静默跳过。
            echo ">> Backup DB"
            if [ ! -f /opt/server-ops/backup/cli.py ]; then
              echo "::error::宿主备份层缺失 /opt/server-ops/backup/cli.py —— 请先在 yecaoyun 执行 bash ops.sh sync 再发布"
              exit 1
            fi
            ( cd /opt/server-ops && /usr/bin/python3 backup/cli.py run nursing-predeploy --kind pre-deploy --notify )
            # 兜底取值：状态文件万一缺失，也不能让 set -e 在这里把部署打断
            BAK="\$(cat $DEPLOY_DIR/backups/.last-pre-deploy 2>/dev/null || echo '(见 backups/ 目录)')"

            IMAGE_VERSION=$VER docker compose -f docker-compose.yml --env-file .env pull || {
              echo "  ⚠ First pull attempt failed, retrying after 10s..."
              sleep 10
              IMAGE_VERSION=$VER docker compose -f docker-compose.yml --env-file .env pull || {
                echo "  ⚠ Second pull attempt failed, retrying after 30s..."
                sleep 30
                IMAGE_VERSION=$VER docker compose -f docker-compose.yml --env-file .env pull || exit 1
              }
            }

            OLD_IMG=\$(docker inspect --format '{{.Config.Image}}' nursing-vp-sim-backend-1 2>/dev/null || echo "")
            OLD_DB_REV=\$(docker exec nursing-vp-sim-backend-1 alembic current 2>/dev/null | head -1 | awk '{print \$1}' || true)
            echo ">> Current: \${OLD_IMG:-none} (db=\${OLD_DB_REV:-unknown})"

            rollback_deploy() {
              echo "  ✗ \$1 Rolling back..."
              if [ -n "\$OLD_DB_REV" ]; then
                echo "  >> attempting alembic downgrade to \$OLD_DB_REV before rolling back image..."
                docker compose -f docker-compose.yml --env-file .env run --rm --no-deps backend alembic downgrade "\$OLD_DB_REV" 2>/dev/null \
                  || echo "  ⚠ downgrade to \$OLD_DB_REV failed; restore backup manually: \$BAK"
              else
                echo "  ⚠ previous DB revision unknown; skipping automatic migration downgrade"
              fi
              if [ -n "\$OLD_IMG" ]; then
                OLD_VER=\$(echo "\$OLD_IMG" | rev | cut -d: -f1 | rev)
                IMAGE_VERSION=\$OLD_VER docker compose -f docker-compose.yml --env-file .env up -d
                echo "  ⚠ rolled back to \$OLD_VER"
              fi
            }

            IMAGE_VERSION=$VER docker compose -f docker-compose.yml --env-file .env up -d --remove-orphans

            echo ">> Health check..."
            OK=false
            for i in \$(seq 1 30); do
              S=\$(docker inspect --format '{{.State.Health.Status}}' nursing-vp-sim-backend-1 2>/dev/null || echo "")
              case "\$S" in
                healthy) echo "  ✓ healthy (\$((i * 2))s)"; OK=true; break ;;
                unhealthy)
                  rollback_deploy "backend unhealthy!"
                  exit 1 ;;
              esac
              sleep 2
            done
            [ "\$OK" = true ] || { rollback_deploy "health check timeout."; exit 1; }

            docker exec nursing-vp-sim-backend-1 curl -sf http://localhost:8000/api/health && echo ">> v$VER ✓"
            echo "$VER|\$(date -u +%Y-%m-%dT%H:%M:%SZ)|ghcr.io/$OWNER/nursing-vp-sim-backend:$VER|ghcr.io/$OWNER/nursing-vp-sim-frontend:$VER|\$(docker exec nursing-vp-sim-backend-1 alembic current 2>/dev/null | head -1 | awk '{print \$1}')" >> .version-history-prod
            tail -50 .version-history-prod > .version-history-prod.tmp && mv .version-history-prod.tmp .version-history-prod
            # Stability-aware prune: keep long-running (>=24h) + in-use + recent rollback buffer
            bash deploy/prune-images.sh || echo "⚠ image prune skipped (non-fatal)"
          DEPLOY

      - name: Smoke check /api/diagnose
        run: |
          if [ -z "${{ secrets.DIAGNOSE_TOKEN }}" ]; then
            echo "⚠ DIAGNOSE_TOKEN 未配置——跳过部署后冒烟（请在仓库 secrets 配置后启用）"
            exit 0
          fi
          RESP=$(curl -sf "https://iomt.205716.xyz/api/diagnose?token=${{ secrets.DIAGNOSE_TOKEN }}") || {
            echo "::error::/api/diagnose 请求失败——服务可能未真正就绪"
            exit 1
          }
          echo "$RESP" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          s = d.get('summary', {})
          print('status =', s.get('status'))
          print('version =', d.get('version'))
          alerts = d.get('alerts') or []
          for a in alerts[:10]:
              print('  alert:', a)
          if s.get('status') not in ('healthy', 'degraded'):
              sys.exit('::error::diagnose status 异常')
          "

      - name: Publish dev report (non-blocking)
        continue-on-error: true
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          cd backend
          python -m ensurepip --upgrade 2>/dev/null || true
          pip install -q uv 2>/dev/null || true
          python -m uv run python ../scripts/dev-report.py --output ../frontend/public/report.html 2>&1 || {
            echo "⚠ Report generation failed — skipping publish"
            exit 0
          }

          scp ../frontend/public/report.html "$USER@$HOST":/tmp/report.html 2>/dev/null || {
            echo "⚠ SCP failed — skipping publish"
            exit 0
          }
          ssh "$USER@$HOST" "
            docker cp /tmp/report.html nursing-vp-sim-frontend-1:/usr/share/nginx/html/report.html 2>/dev/null && \
            rm -f /tmp/report.html && \
            echo '✓ report.html published to container' || echo '⚠ docker cp failed'
          " 2>/dev/null
          echo "✓ → https://iomt.205716.xyz/report.html"

      # 通知只在宿主（/opt/server-ops/notify）一处实现：CI 通过**部署用的 SSH** 上报事件，
      # 宿主负责路由、渲染、静音与投递审计。因此这里不需要任何 webhook secret，
      # 也不需要回读开关（宿主会自行判断静音；静音时不发但会记审计）。
      - name: Notify deploy (via host)
        if: always()
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          VERSION: ${{ steps.resolve_version.outputs.version }}
          STATUS: ${{ job.status }}
          COMMITS: ${{ steps.change_summary.outputs.commits }}
        run: |
          set -uo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 "$USER@$HOST" \
            "cd /opt/server-ops && python3 notify/cli.py deploy \
               --set project=nursing-vp-sim \
               --set version='$VERSION' \
               --set env=production \
               --set url='https://iomt.205716.xyz' \
               --set status='$STATUS' \
               --set actor='${{ github.actor }}' \
               --set run_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
               --set-file commits=/dev/stdin" <<< "$COMMITS" \
            || echo "⚠ 部署通知上报失败（不阻断部署）"

      - name: "✅ Deployed"
        run: echo "v${{ steps.resolve_version.outputs.version }} → iomt.205716.xyz 🚀"
