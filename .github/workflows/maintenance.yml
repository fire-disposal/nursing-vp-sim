name: Maintenance Mode Toggle

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Action'
        required: true
        type: choice
        options:
          - enable
          - disable

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Toggle maintenance mode
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          ENV="${{ inputs.environment }}"

          if [ "$ENV" = "staging" ]; then
            FLAG="/opt/nursing-vp-sim/maintenance.staging.on"
            DOMAIN="test.205716.xyz"
          else
            FLAG="/opt/nursing-vp-sim/maintenance.on"
            DOMAIN="iomt.205716.xyz"
          fi

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          if [ "${{ inputs.action }}" = "enable" ]; then
            echo ">> Enabling maintenance mode for $ENV ($DOMAIN)"
            ssh "$USER@$HOST" "touch $FLAG && sudo nginx -t && sudo nginx -s reload && echo 'maintenance ON for $DOMAIN'"
          else
            echo ">> Disabling maintenance mode for $ENV ($DOMAIN)"
            ssh "$USER@$HOST" "rm -f $FLAG && sudo nginx -t && sudo nginx -s reload && echo 'maintenance OFF for $DOMAIN'"
          fi

      - name: "Result"
        run: echo "${{ inputs.action }} maintenance on ${{ inputs.environment }} ✓"
