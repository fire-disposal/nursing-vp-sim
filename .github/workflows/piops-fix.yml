name: PiOps repair

on:
  workflow_dispatch:
    inputs:
      error_window_minutes:
        description: 线上错误窗口（分钟）
        required: true
        default: "60"
        type: string
      focus_hint:
        description: 可选排查方向提示
        required: false
        type: string
      target_env:
        description: 诊断数据来源（默认测试服）
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

concurrency:
  group: piops-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      DIAGNOSE_URL: ${{ inputs.target_env == 'staging' && vars.PIOPS_STAGING_DIAGNOSE_URL || vars.PIOPS_DIAGNOSE_URL }}
      DIAGNOSE_TOKEN: ${{ secrets.PIOPS_DIAGNOSE_TOKEN }}
      ERROR_WINDOW: ${{ inputs.error_window_minutes }}
      TARGET_ENV: ${{ inputs.target_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/piops
          fetch-depth: 1

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIAGNOSE_URL"
          test -n "$DIAGNOSE_TOKEN"
          [[ "$ERROR_WINDOW" =~ ^[0-9]+$ ]]
          (( ERROR_WINDOW >= 1 && ERROR_WINDOW <= 1440 ))

      - name: Fetch bounded context from target env
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p context
          curl --fail --silent --show-error --max-time 20 --retry 2 \
            --get "$DIAGNOSE_URL" \
            --data-urlencode "token=$DIAGNOSE_TOKEN" \
            --data-urlencode "error_window_minutes=$ERROR_WINDOW" \
            --data-urlencode "error_groups=20" \
            --output context/diagnostics.json

          python -m json.tool context/diagnostics.json >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: piops-context
          path: context
          retention-days: 2
          if-no-files-found: error

  pi-work:
    needs: collect-context
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      FOCUS_HINT: ${{ inputs.focus_hint }}
      TARGET_ENV: ${{ inputs.target_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: piops-context
          path: .piops-runtime/context

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.83.0

      - name: Configure DeepSeek-compatible provider
        shell: bash
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          test -n "$DEEPSEEK_BASE_URL"
          mkdir -p "$PI_CODING_AGENT_DIR"
          python .github/piops/configure_pi.py \
            --base-url "$DEEPSEEK_BASE_URL" \
            --model "$DEEPSEEK_MODEL" \
            --output "$PI_CODING_AGENT_DIR/models.json"

      - name: Resolve checkout baseline
        id: baseline
        run: |
          DESCRIBE=$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)
          echo "checkout_baseline=$DESCRIBE" >> "$GITHUB_OUTPUT"

      - name: Build fixed task prompt
        run: |
          python .github/piops/build_prompt.py \
            --diagnostics .piops-runtime/context/diagnostics.json \
            --focus-hint "$FOCUS_HINT" \
            --checkout-baseline "${{ steps.baseline.outputs.checkout_baseline }}" \
            --target-env "$TARGET_ENV" \
            --output .piops-runtime/prompt.md

      - name: Run Pi in temporary source workspace
        shell: bash
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          set -euo pipefail
          pi --print \
            --no-session \
            --no-extensions \
            --no-skills \
            --no-prompt-templates \
            --no-themes \
            --no-context-files \
            --provider piops-deepseek \
            --model "$DEEPSEEK_MODEL" \
            --thinking high \
            --tools read,grep,find,ls,edit,write,bash \
            @.piops-runtime/prompt.md \
            | tee .piops-runtime/pi-output.txt

      - name: Guard and validate proposal
        shell: bash
        run: |
          set -euo pipefail
          python .github/piops/check_diff.py
          bash .github/piops/validate.sh
          test -s .piops-runtime/pi-report.md

      - name: Export proposal
        shell: bash
        run: |
          set -euo pipefail
          git add -N .
          git diff --binary -- . \
            ':(exclude).piops-runtime/**' \
            > .piops-runtime/pi.patch
          test -s .piops-runtime/pi.patch

      - uses: actions/upload-artifact@v7
        with:
          name: piops-proposal
          path: |
            .piops-runtime/pi.patch
            .piops-runtime/pi-report.md
            .piops-runtime/pi-output.txt
          retention-days: 7
          if-no-files-found: error

  publish-pr:
    needs: pi-work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: piops-proposal
          path: .piops-runtime

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .piops-runtime/pi.patch
          git apply .piops-runtime/pi.patch

      - name: Push proposal branch
        id: branch
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          set -euo pipefail
          branch="piops/${TARGET_ENV}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "piops[bot]"
          git config user.email "piops[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A -- . ':(exclude).piops-runtime/**'
          git commit -m "fix: propose repair from production diagnostics"
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.branch.outputs.name }}
          TARGET_ENV: ${{ inputs.target_env }}
        shell: bash
        run: |
          set -euo pipefail
          title="fix: [${TARGET_ENV}] PiOps proposal from diagnostics"
          gh pr create \
            --draft \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$HEAD_BRANCH" \
            --title "$title" \
            --body-file .piops-runtime/pi-report.md
