name: Emergency Rollback (Production)

run-name: "[Production] Rollback to v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Rollback target version (e.g. 2026.06.02-2)'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rollback
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh "$USER@$HOST" "echo '$TOKEN' | docker login ghcr.io -u ${{ github.actor }} --password-stdin" 2>&1 | tail -1

          scp deploy/rollback.sh "$USER@$HOST":/opt/nursing-vp-sim/rollback.sh
          ssh "$USER@$HOST" "chmod +x /opt/nursing-vp-sim/rollback.sh && cd /opt/nursing-vp-sim && bash rollback.sh --yes ${{ inputs.version }}"
