name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要回滚到的版本号 (e.g. 1.2.2)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rollback
        run: |
          set -e
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh "$USER@$HOST" "cd /opt/nursing-vp-sim && bash rollback.sh --yes ${{ inputs.version }}"
