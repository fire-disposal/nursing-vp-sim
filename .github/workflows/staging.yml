name: Build & Deploy to Staging

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate alembic migrations
        run: |
          cd backend
          pip install -q alembic psycopg sqlalchemy >/dev/null 2>&1

          # Rule 1: single head only
          HEADS=$(alembic heads 2>&1)
          HEAD_COUNT=$(echo "$HEADS" | wc -l)
          if [ "$HEAD_COUNT" -gt 1 ]; then
            echo "::error::Multiple alembic heads detected"
            echo "$HEADS"
            exit 1
          fi
          echo "✓ Single head: $HEADS"

          # Rule 2: check the HEAD migration only
          HEAD_REV=$(echo "$HEADS" | head -1)
          HEAD_FILE=$(grep -rl "Revision ID: $HEAD_REV" migrations/versions/ | head -1)
          if [ -z "$HEAD_FILE" ]; then
            echo "::warning::Could not find HEAD migration file for $HEAD_REV"
            exit 0
          fi
          echo "  checking: $(basename "$HEAD_FILE")"

          AUTOGEN_MARKER="# ### commands auto generated by Alembic"
          REASON_PREFIX="# Manual override reason:"

          if grep -qF "$AUTOGEN_MARKER" "$HEAD_FILE"; then
            # autogenerated — must NOT contain op.execute()
            if grep -qE '^\s+op\.execute\(' "$HEAD_FILE"; then
              echo "::error::Autogenerated migration $(basename "$HEAD_FILE") contains op.execute()"
              echo "::error::Move data operations to a separate data_only migration (see AGENTS.md)"
              exit 1
            fi
            echo "✓ Autogenerated DDL — no data ops"
          elif grep -qE "^$REASON_PREFIX\s*data_only" "$HEAD_FILE"; then
            echo "✓ Manual data migration — reason: data_only"
          else
            echo "::error::Migration $(basename "$HEAD_FILE") is neither autogenerated nor has a valid manual reason"
            echo "::error::Add '# Manual override reason: data_only' or use 'pnpm run db:migration' (see AGENTS.md)"
            exit 1
          fi
          echo "✓ Migration check passed"

      - name: Normalize owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/nursing-vp-sim
          tags: type=match,pattern=v(.*),group=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/nursing-vp-sim-backend:${{ steps.meta.outputs.version }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/nursing-vp-sim-frontend:${{ steps.meta.outputs.version }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Staging
        run: |
          HOST="${{ secrets.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}"
          VER="${{ steps.meta.outputs.version }}"

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp deploy/docker-compose.staging.yml "$USER@$HOST":/opt/nursing-vp-sim/docker-compose.staging.yml

          echo ">> Deploy nginx config"
          scp deploy/nginx/test.205716.xyz.conf "$USER@$HOST":/etc/nginx/sites-enabled/test.205716.xyz.conf
          scp deploy/nginx/snippets/block-scanners.conf "$USER@$HOST":/etc/nginx/snippets/block-scanners.conf
          scp deploy/nginx/snippets/maintenance.nginx.conf "$USER@$HOST":/etc/nginx/snippets/maintenance.nginx.conf
          scp deploy/nginx/maintenance.html "$USER@$HOST":/opt/nursing-vp-sim/maintenance.html
          ssh "$USER@$HOST" "sudo nginx -t && sudo nginx -s reload || echo 'nginx reload skipped (config test failed)'"

          ssh "$USER@$HOST" << DEPLOY
            set -e
            cd /opt/nursing-vp-sim
            printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo ">> Staging v$VER"

            for attempt in \$(seq 1 5); do
              echo "  Pull attempt \$attempt/5..."
              if IMAGE_VERSION=$VER docker compose -f docker-compose.staging.yml --env-file .env -p nursing-vp-staging pull 2>&1; then
                echo "  ✓ Pull ok"
                break
              fi
              if [ "\$attempt" = "5" ]; then
                echo "  ✗ Pull failed after 5 attempts"
                exit 1
              fi
              echo "  ⚠ Pull failed, retrying in 15s..."
              sleep 15
            done

            OLD_IMG=\$(docker inspect --format '{{.Config.Image}}' nursing-backend-staging 2>/dev/null || echo "")
            IMAGE_VERSION=$VER docker compose -f docker-compose.staging.yml --env-file .env -p nursing-vp-staging up -d --remove-orphans
            echo ">> Health check..."
            OK=false
            for i in \$(seq 1 30); do
              S=\$(docker inspect --format '{{.State.Health.Status}}' nursing-backend-staging 2>/dev/null || echo "")
              case "\$S" in
                healthy) echo "  ✓ healthy (\$((i * 2))s)"; OK=true; break ;;
                unhealthy)
                  echo "  ✗ unhealthy! Rolling back..."
                  echo "  >> attempting alembic downgrade before rolling back image..."
                  docker compose -f docker-compose.staging.yml --env-file .env -p nursing-vp-staging exec -T backend alembic downgrade -1 2>/dev/null \
                    || echo "  ⚠ downgrade failed (container may be too broken, will be dropped)"
                  if [ -n "\$OLD_IMG" ]; then
                    OLD_VER=\$(echo "\$OLD_IMG" | rev | cut -d: -f1 | rev)
                    IMAGE_VERSION=\$OLD_VER docker compose -f docker-compose.staging.yml --env-file .env -p nursing-vp-staging up -d
                    echo "  ⚠ rolled back to \$OLD_VER"
                  fi
                  exit 1 ;;
              esac
              sleep 2
            done
            [ "\$OK" = true ] || { echo "  ✗ timeout"; exit 1; }
            curl -sf http://127.0.0.1:9081/api/health && echo ">> Staging v$VER ✓"
            echo "\$VER|\$(date -u +%Y-%m-%dT%H:%M:%SZ)|ghcr.io/${{ steps.owner.outputs.value }}/nursing-vp-sim-backend:\$VER|ghcr.io/${{ steps.owner.outputs.value }}/nursing-vp-sim-frontend:\$VER" >> .version-history
            tail -10 .version-history > .version-history.tmp && mv .version-history.tmp .version-history
            docker image prune -f
          DEPLOY

      - name: "✅ Staging"
        run: echo "v${{ steps.meta.outputs.version }} → test.205716.xyz 🧪"
