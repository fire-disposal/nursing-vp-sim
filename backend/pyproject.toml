[project]
name = "virtual-patient-backend"
version = "2026.05.29"
description = "虚拟患者训练系统 - 后端 API"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.2.0",
    "pytest>=9.0.3",
    "pytest-alembic>=0.12.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "ty>=0.0.43",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "pg: tests requiring local PostgreSQL connection",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["migrations/versions/"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",   # `id` parameter shadowing (ORM model idiom)
    "ANN",    # type annotations (too noisy for existing code)
    "ARG001", # unused function arguments (FastAPI Depends auth guards are intentional)
    "ARG002", # unused method arguments (same)
    "ASYNC109", # timeout parameter name (legacy, not using asyncio.timeout)
    "B008",   # Depends in argument defaults (standard FastAPI idiom)
    "B904",   # raise from (style preference)
    "BLE001", # blind except (some intentional; review later)
    "C901",   # too-complex (known complex functions, refactor later)
    "COM812", # conflicts with formatter
    "D",      # docstrings
    "E402",   # import after env var setup (test conftest pattern)
    "E501",   # line too long (Chinese prompt strings)
    "EM",     # empty lines in f-strings
    "ERA001", # commented-out code (documentation comments)
    "FAST002",# non-Annotated Depends (standard FastAPI idiom)
    "FBT001", # boolean positional arg (style)
    "FBT002", # boolean default arg (style)
    "G004",   # f-string in logging (style)
    "INP001", # implicit namespace (alembic env.py)
    "N801",   # class naming convention (intentional lowercase)
    "N806",   # uppercase in function (test fixture naming)
    "N814",   # camelCase import alias (locale abbreviations AS/LC/PT)
    "N817",   # camelCase import alias (locale abbreviations)
    "PERF401",# manual-list-comprehension (often less readable)
    "PLC0415",# import at function level (intentional for circular import avoidance)
    "PLC1901",# compare-to-empty-string too aggressive
    "PLR0913",# too-many-arguments
    "PLR0912",# too-many-branches
    "PLR0915",# too-many-statements
    "PLR0911",# too-many-return-statements
    "PLR2004",# magic-value-comparison
    "PLR6301",# no-self-use
    "PLW0603",# global statement (intentional singleton pattern)
    "PTH100", # os.path → pathlib (legacy, migrate later)
    "PTH103", # os.makedirs → Path.mkdir (legacy) 
    "PTH112", # os.path.isdir → pathlib (legacy)
    "PTH113", # os.path.isfile → pathlib (legacy)
    "PTH118", # os.path.join → pathlib (legacy)
    "PTH120", # os.path.dirname → pathlib (legacy)
    "PTH123", # open() → Path.open() (legacy)
    "PTH204", # os.path.getmtime → pathlib (legacy)
    "PTH208", # os.listdir → pathlib (legacy)
    "RUF001", # ambiguous unicode — fullwidth punctuation is intentional (Chinese)
    "RUF002", # ambiguous unicode in docstrings — same
    "RUF003", # ambiguous unicode in comments — same
    "S101",   # assert (tests use it)
    "S105",   # hardcoded password string (test credentials)
    "S106",   # hardcoded password arg (test fixtures)
    "S110",   # try-except-pass (intentional middleware pattern)
    "S311",   # non-crypto random (backoff jitter, not crypto)
    "SLF001", # private-member-access
    "T201",   # print
    "TC001",  # type-checking imports (project convention)
    "TC003",  # same
    "TID252", # relative imports (project convention)
    "TRY003", # raise-vanilla-args
    "TRY300", # move return to else (style)
    "TRY301", # abstract raise (style)
    "TRY401", # exception in logging.exception (style)
    "UP046",  # Generic subclass (style)
    "UP047",  # generic function type params (style)
    "W293",   # blank line whitespace (auto-format)
    "ARG005", # unused lambda arg (intentional closures)
    "B007",   # loop variable unused (style)
    "C401",   # unnecessary generator (style)
    "C408",   # unnecessary dict() call (style)
    "C416",   # unnecessary dict comprehension (style)
    "E712",   # equality to True (ORM pattern)
    "F841",   # unused variable (sometimes intentional test setup)
    "FURB171",# membership test style
    "N818",   # exception naming (legacy)
    "PERF102",# dict values() micro-opt
    "PLW0108",# lambda may be unnecessary (style)
    "PLW2901",# loop var overwrite (style)
    "PT011",  # pytest.raises too broad (style)
    "PTH104", # os.rename → Path (legacy)
    "PTH107", # os.remove → Path (legacy)
    "PTH202", # os.path.getsize → Path (legacy)
    "RUF005", # iterable unpacking style
    "RUF012", # mutable default attr (dataclass pattern)
    "RUF059", # unpacked variable unused (style)
    "SIM102", # simplify nested if (style)
    "SIM103", # return negated (style)
    "SIM105", # contextlib.suppress (style)
    "TRY400", # logging.exception vs error (style)
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
