# Production Compose — 部署时通过 IMAGE_VERSION 环境变量注入镜像 tag
# 用法: IMAGE_VERSION=2026.06.02-3 docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d

services:
  db:
    image: postgres:15
    container_name: nursing-db
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: nursing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nursing_vp
      TZ: Asia/Shanghai
    volumes:
      - ai_vp_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nursing -d nursing_vp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/fire-disposal/nursing-vp-sim-backend:${IMAGE_VERSION}
    container_name: nursing-vp-sim-backend-1
    # 资源上限：uvicorn --workers 2 每 worker 常驻 ~116MB（import 基线，见 docs/09 内存排查），
    # 留足 LLM 日志队列与突发余量。无上限时单个容器可耗尽宿主机并连带其它租户。
    mem_limit: 640m
    ports:
      - "127.0.0.1:9001:8000"
    volumes:
      - ai_vp_logs:/app/data/llm_logs
      # 诊断归档（后端错误 + 前端遥测 JSONL）必须跨容器重建存活，否则每次发版都丢取证窗口。
      - ai_vp_diagnostics:/app/data/diagnostics
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nursing:${POSTGRES_PASSWORD}@db:5432/nursing_vp
      CORS_ORIGINS: ${CORS_ORIGINS}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/fire-disposal/nursing-vp-sim-frontend:${IMAGE_VERSION}
    container_name: nursing-vp-sim-frontend-1
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:9000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ai_vp_pg_data:
  ai_vp_logs:
  ai_vp_diagnostics:
