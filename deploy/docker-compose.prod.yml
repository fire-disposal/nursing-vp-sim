# Production Compose — 部署时通过 IMAGE_VERSION 环境变量注入镜像 tag
# 用法: IMAGE_VERSION=2026.06.02-3 docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d

services:
  db:
    image: postgres:15
    container_name: nursing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nursing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nursing_vp
      TZ: Asia/Shanghai
    volumes:
      - ai_vp_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nursing -d nursing_vp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/fire-disposal/nursing-vp-sim-backend:${IMAGE_VERSION}
    container_name: nursing-vp-sim-backend-1
    ports:
      - "127.0.0.1:9001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nursing:${POSTGRES_PASSWORD}@db:5432/nursing_vp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/fire-disposal/nursing-vp-sim-frontend:${IMAGE_VERSION}
    ports:
      - "9000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ai_vp_pg_data:
