# test.iomt.205716.xyz — Nursing-VP Staging
# 放到服务器 /etc/nginx/sites-enabled/test.iomt.205716.xyz.conf

server {
    listen 80;
    listen [::]:80;
    server_name test.iomt.205716.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.iomt.205716.xyz;

    # === 证书获取（先跑 HTTP，再替换为真实路径）===
    # certbot certonly --webroot -w /var/www/html -d test.iomt.205716.xyz
    # 或扩展现有证书:
    # certbot --expand -d iomt.205716.xyz -d test.iomt.205716.xyz

    ssl_certificate /etc/letsencrypt/live/test.iomt.205716.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.iomt.205716.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
