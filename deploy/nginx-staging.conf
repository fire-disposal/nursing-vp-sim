# test.205716.xyz — Nursing-VP Staging
# 证书: Let's Encrypt wildcard (*.205716.xyz)，和 iomt.205716.xyz 共用
# 位置: /etc/nginx/sites-enabled/test.205716.xyz.conf

server {
    listen 80;
    listen [::]:80;
    server_name test.205716.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.205716.xyz;

    ssl_certificate /etc/letsencrypt/live/iomt.205716.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iomt.205716.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
