<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统维护中 — 护理虚拟患者训练系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    background: #f0f4f8;
    color: #334155;
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
    padding: 48px 40px;
    max-width: 480px;
    width: 90%;
    text-align: center;
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 15px; color: #64748b; line-height: 1.6; margin-bottom: 20px; }
  .note { font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x1F6E0;</div>
    <h1>系统维护中</h1>
    <p>护理虚拟患者训练系统正在进行维护，预计短时间内恢复。请稍后再试。</p>
    <p class="note">如有紧急问题，请联系管理员。</p>
  </div>
</body>
</html>
