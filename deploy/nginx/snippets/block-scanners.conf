# 基础扫描拦截 — 返回 444（直接断开连接，无响应体）
# Deploy target: /etc/nginx/snippets/block-scanners.conf

location ~* ^/(docs|redoc|openapi\.json|\.git|\.env|\.svn|wp-admin|wp-login|phpmyadmin|adminer|\.well-known/security\.txt|config\.php|xmlrpc\.php) {
    return 444;
}
location = /api {
    return 444;
}

# Metrics are consumed locally by /opt/monitor; never expose them publicly.
location = /api/metrics {
    return 444;
}

# Common legacy API probe namespaces observed in staging metrics.
location ~* ^/api/(site|common|shop|index|home)(/|$) {
    return 444;
}

location ~* ^/api/user/ismustmobile(/|$) {
    return 444;
}

location ~* \.(php|asp|aspx|jsp)$ {
    return 444;
}

if ($http_user_agent ~* "(gobuster|nikto|sqlmap|nmap|dirbuster|wpscan|zgrab)") {
    return 444;
}

if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
    return 444;
}
