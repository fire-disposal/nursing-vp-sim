# 维护模式开关
# 主配置中需先设置 $maintenance_flag 变量指向具体环境的标记文件路径
# 开启: touch <flag_path> && nginx -s reload
# 关闭: rm -f <flag_path> && nginx -s reload
# 由 GitHub Actions maintenance.yml 控制
# Deploy target: /etc/nginx/snippets/maintenance.nginx.conf

set $maintenance 0;
if (-f $maintenance_flag) {
    set $maintenance 1;
}
