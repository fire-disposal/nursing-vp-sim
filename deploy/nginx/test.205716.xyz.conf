# 已退役（2026-09-14，单实例收敛）：本 vhost 只保留 301 跳转，指向正式域。
# 双栈已合并为单实例（见 docs/ops/single-instance-migration.md），
# 后端/前端容器 nursing-*-staging 与 nursing-db-staging 已下线。
# 保留 vhost 是为了旧书签/链接不 404；确认无外部引用后可整体删除本文件。
server {
    listen 80;
    listen [::]:80;
    server_name test.205716.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        # 单跳直达正式域（避免 http→https→iomt 两跳）
        return 301 https://iomt.205716.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.205716.xyz;

    ssl_certificate /etc/letsencrypt/live/iomt.205716.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iomt.205716.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/block-scanners.conf;

    # 单实例收敛：旧测试域一律跳到正式域（保留路径与查询串）
    return 301 https://iomt.205716.xyz$request_uri;
}
