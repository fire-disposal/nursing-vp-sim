<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="夜间急诊观察室：监护仪与输液架在左，病床与检查床在中景，走廊冷光从右侧门缝漏进来">
	<title>夜间急诊观察室</title>
	<defs>
		<linearGradient id="wall" x1="0" y1="0" x2="0.2" y2="1">
			<stop offset="0" stop-color="#0c1d1f"/>
			<stop offset="0.42" stop-color="#123033"/>
			<stop offset="1" stop-color="#0e2729"/>
		</linearGradient>
		<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0d2426"/>
			<stop offset="0.6" stop-color="#081517"/>
			<stop offset="1" stop-color="#050e10"/>
		</linearGradient>
		<!-- 门缝冷光：从右上斜射到地面 -->
		<linearGradient id="doorBeam" x1="0.9" y1="0" x2="0.15" y2="1">
			<stop offset="0" stop-color="#b7f0e6" stop-opacity="0.38"/>
			<stop offset="0.45" stop-color="#79c9c0" stop-opacity="0.14"/>
			<stop offset="1" stop-color="#3d8a86" stop-opacity="0"/>
		</linearGradient>
		<radialGradient id="monitorGlow" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#6fe0cd" stop-opacity="0.42"/>
			<stop offset="1" stop-color="#6fe0cd" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#cdece4" stop-opacity="0.30"/>
			<stop offset="1" stop-color="#cdece4" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#16383a"/>
			<stop offset="0.46" stop-color="#245457"/>
			<stop offset="0.75" stop-color="#1a3f42"/>
			<stop offset="1" stop-color="#122c2e"/>
		</linearGradient>
		<linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#e7efe9"/>
			<stop offset="1" stop-color="#aebfba"/>
		</linearGradient>
		<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#2f5254"/>
			<stop offset="0.5" stop-color="#5d8a8c"/>
			<stop offset="1" stop-color="#253f41"/>
		</linearGradient>
		<radialGradient id="vignette" cx="0.52" cy="0.5" r="0.75">
			<stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
		</radialGradient>
		<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
			<feGaussianBlur stdDeviation="22"/>
		</filter>
		<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="6"/>
		</filter>
	</defs>

	<!-- ── 墙 / 地 ─────────────────────────────────────────── -->
	<rect width="1600" height="900" fill="url(#wall)"/>
	<path d="M0 610 H1600 V900 H0 Z" fill="url(#floor)"/>
	<!-- 墙裙（医院常见的双色墙） -->
	<rect x="0" y="470" width="1600" height="140" fill="#0f2b2d" opacity="0.85"/>
	<rect x="0" y="466" width="1600" height="5" fill="#2c5658" opacity="0.7"/>
	<rect x="0" y="606" width="1600" height="8" fill="#081617"/>

	<!-- ── 走廊门（右）+ 冷光斜射 ───────────────────────────── -->
	<g>
		<rect x="1296" y="96" width="196" height="516" rx="4" fill="#0a191a"/>
		<rect x="1312" y="112" width="164" height="484" rx="3" fill="#0e2426"/>
		<rect x="1330" y="130" width="128" height="448" fill="#0a1c1e"/>
		<!-- 门上观察窗：透出走廊灯 -->
		<rect x="1360" y="176" width="68" height="92" rx="4" fill="#8fd6cb" opacity="0.55"/>
		<rect x="1360" y="176" width="68" height="92" rx="4" fill="url(#doorBeam)"/>
		<circle cx="1316" cy="372" r="6" fill="#4d8a86" opacity="0.8"/>
	</g>
	<path d="M1296 120 L560 900 L1600 900 L1600 120 Z" fill="url(#doorBeam)" opacity="0.55"/>

	<!-- ── 窗帘（左，被走廊光擦亮一侧）─────────────────────── -->
	<g>
		<path d="M0 60 C130 76 208 168 196 330 C186 470 140 556 112 610 H0 Z" fill="url(#curtain)"/>
		<path d="M0 60 C104 84 160 180 150 336 C142 468 104 556 84 610 H0 Z" fill="#0e2527" opacity="0.75"/>
		<path d="M34 88 C116 122 158 214 146 356 C138 468 106 552 92 606" fill="none" stroke="#3f7376" stroke-width="2.5" opacity="0.5"/>
		<path d="M76 104 C138 146 168 232 156 366" fill="none" stroke="#2f5a5d" stroke-width="2" opacity="0.45"/>
		<rect x="-4" y="48" width="352" height="10" rx="5" fill="#0c1e20"/>
	</g>

	<!-- ── 器械带 / 墙面插座 ─────────────────────────────── -->
	<g opacity="0.85">
		<rect x="520" y="214" width="196" height="46" rx="5" fill="#0d2628" stroke="#2b5254" stroke-width="1.5"/>
		<circle cx="548" cy="237" r="9" fill="#123033" stroke="#3a6a6c" stroke-width="1.5"/>
		<circle cx="582" cy="237" r="9" fill="#123033" stroke="#3a6a6c" stroke-width="1.5"/>
		<rect x="608" y="228" width="34" height="18" rx="2" fill="#173c3e"/>
		<rect x="650" y="228" width="34" height="18" rx="2" fill="#173c3e"/>
		<circle cx="700" cy="237" r="4" fill="#e2b866" opacity="0.8"/>
	</g>

	<!-- ── 输液架（中左）──────────────────────────────────── -->
	<g>
		<rect x="392" y="150" width="7" height="460" rx="3" fill="url(#metal)"/>
		<path d="M356 152 H436" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
		<path d="M360 152 V176 M432 152 V176" stroke="#284749" stroke-width="4" stroke-linecap="round"/>
		<!-- 输液袋 -->
		<rect x="356" y="176" width="56" height="104" rx="16" fill="#1b4647" opacity="0.9" stroke="#4a8385" stroke-width="2"/>
		<rect x="370" y="188" width="9" height="66" rx="4.5" fill="#a8e3d8" opacity="0.55"/>
		<path d="M384 280 V330" stroke="#3d6b6d" stroke-width="3"/>
		<ellipse cx="398" cy="592" rx="46" ry="9" fill="#000" opacity="0.4" filter="url(#soft)"/>
	</g>

	<!-- ── 监护仪（右上，屏幕发冷光）───────────────────────── -->
	<g>
		<ellipse cx="1030" cy="250" rx="180" ry="140" fill="url(#monitorGlow)" filter="url(#glow)"/>
		<rect x="920" y="176" width="226" height="150" rx="8" fill="#08191b" stroke="#2b5254" stroke-width="2.5"/>
		<rect x="934" y="190" width="198" height="112" rx="4" fill="#0a2c2e"/>
		<!-- 波形：心电 + 血氧 -->
		<path d="M942 258 H976 L986 240 L996 286 L1008 226 L1018 258 H1052 L1062 248 L1070 258 H1118"
			fill="none" stroke="#6fe0cd" stroke-width="2.4" stroke-linejoin="round" opacity="0.95"/>
		<path d="M942 214 H1090" fill="none" stroke="#3f9c94" stroke-width="1.6" opacity="0.4"/>
		<path d="M942 232 H1064" fill="none" stroke="#3f9c94" stroke-width="1.6" opacity="0.32"/>
		<!-- 数字块（示意，不写假数值：用色块暗示读数区） -->
		<rect x="1002" y="346" width="62" height="44" rx="3" fill="#0a1b1d"/>
		<rect x="1104" y="342" width="9" height="98" fill="#0a1b1d"/>
		<circle cx="1108" cy="452" r="19" fill="#0a1b1d" stroke="#1e3f41" stroke-width="2"/>
	</g>

	<!-- ── 中景：空着的检查床（人物坐在前景床边）──────────── -->
	<g opacity="0.95">
		<path d="M640 520 H1180 V548 H640 Z" fill="url(#bed)"/>
		<path d="M640 520 H1180" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
		<path d="M700 548 V596 M1120 548 V596" stroke="#2b4c4e" stroke-width="8"/>
		<path d="M640 600 H1180" stroke="#22423f" stroke-width="6"/>
		<!-- 床垫侧面的折痕 -->
		<path d="M700 534 H1120" stroke="#8fa4a0" stroke-width="1.6" opacity="0.5"/>
	</g>

	<!-- ── 器械车（右前景一角）────────────────────────────── -->
	<g>
		<rect x="1120" y="600" width="380" height="14" rx="5" fill="url(#metal)"/>
		<rect x="1150" y="614" width="10" height="120" fill="#153436"/>
		<rect x="1460" y="614" width="10" height="120" fill="#153436"/>
		<rect x="1176" y="570" width="104" height="30" rx="5" fill="#123033" stroke="#33605f" stroke-width="1.5"/>
		<ellipse cx="1310" cy="742" rx="200" ry="16" fill="#000" opacity="0.45" filter="url(#soft)"/>
	</g>

	<!-- ── 地面光影：走廊光在地砖上的反射 ────────────────── -->
	<path d="M1240 620 L1600 620 L1600 760 L980 900 L760 900 Z" fill="#5fb3ad" opacity="0.07"/>
	<path d="M620 610 H1600" stroke="#3f7376" stroke-width="2" opacity="0.35"/>

	<!-- ── 整体压暗 ─────────────────────────────────────── -->
	<rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
