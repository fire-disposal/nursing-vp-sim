# WebSocket upgrade support: map Upgrade header → correct Connection value.
# When client sends `Upgrade: websocket`, Connection becomes "upgrade";
# otherwise Connection is "" (keep-alive, required for SSE streaming).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 基础扫描拦截
    location ~* ^/(\.git|\.env|\.svn|wp-admin|wp-login|phpmyadmin|adminer|config\.php|xmlrpc\.php) {
        return 444;
    }
    location ~* \.(php|asp|aspx|jsp)$ {
        return 444;
    }
    if ($http_user_agent ~* "(gobuster|nikto|sqlmap|nmap|dirbuster|wpscan|zgrab)") {
        return 444;
    }
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 444;
    }

    # 前端 SPA 路由
    location = /report {
        return 301 /report.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 文档代理
    location /docs {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /redoc {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # SSE 流式支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 长超时适配评分（~120s）和流式对话
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
