<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenes Sandbox</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }

      :root {
        --bg: #f8fafc;
        --fg: #111827;
        --card: #ffffff;
        --card-fg: #111827;
        --muted: #f1f5f9;
        --muted-fg: #475569;
        --border: #e2e8f0;
        --primary: #0d5f5a;
        --primary-fg: #ffffff;
        --accent: #0d5f5a;
        --accent-fg: #0d5f5a;
        --destructive: #dc2626;
        --warning: #f59e0b;
        --success: #16a34a;
        --canvas: #ede8e2;
        --watermark: #00000033;
      }
      .dark {
        --bg: #0b1120;
        --fg: #e2e8f0;
        --card: #0f1829;
        --card-fg: #e2e8f0;
        --muted: #0f1829;
        --muted-fg: #94a3b8;
        --border: #1e293b;
        --primary: #0d5f5a;
        --primary-fg: #ffffff;
        --accent: #4fc3f7;
        --accent-fg: #4fc3f7;
        --destructive: #ef4444;
        --warning: #f59e0b;
        --success: #22c55e;
        --canvas: #1e1e28;
        --watermark: #ffffff22;
      }
      body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
